# Render blueprint: Dashboard → New → Blueprint → this repo.
# One service runs the API and the ISU sync worker. It's on the free plan,
# which sleeps after 15 minutes without requests: ISU is only polled while
# someone has the app open. Switch to `starter` to keep it always on.
services:
  - type: web
    name: short-track-live
    runtime: node
    region: oregon            # same AWS region as the Supabase project (us-west-2)
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase Session pooler string (Connect → Session pooler). Render has
      # no IPv6, so the direct db.<ref>.supabase.co connection won't work.
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN
        generateValue: true
      # Ask: OpenAI answers questions from the database. Unset turns it off.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
