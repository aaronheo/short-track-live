name: ShortTrackLive
options:
  bundleIdPrefix: com.aaronheo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # The app and its widget extension must match.
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShortTrackLive:
    type: application
    platform: iOS
    sources:
      - path: ShortTrackLive
      - path: Shared
    dependencies:
      - target: ShortTrackLiveWidgets
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: ShortTrackLive/ShortTrackLive.entitlements
      properties:
        # Xcode switches this to production when exporting for TestFlight.
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronheo.shorttracklive
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ShortTrackLive/Info.plist
      properties:
        CFBundleDisplayName: Short Track
        CFBundleName: Short Track
        CFBundleURLTypes:
          - CFBundleURLName: com.aaronheo.shorttracklive
            CFBundleURLSchemes: [shorttrack]
        APIBaseURL: $(API_BASE_URL)
        APIToken: $(API_TOKEN)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers: [com.aaronheo.shorttracklive.refresh]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Short Track connects to its results server on your local network during development.
  # Live Activity for a favorite's race (Lock Screen and Dynamic Island).
  ShortTrackLiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ShortTrackLiveWidgets
      - path: Shared
      - path: ShortTrackLive/Resources/Assets.xcassets
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronheo.shorttracklive.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ShortTrackLiveWidgets/Info.plist
      properties:
        CFBundleDisplayName: Short Track
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ShortTrackLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShortTrackLiveTests
    dependencies:
      - target: ShortTrackLive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronheo.shorttracklive.tests
schemes:
  ShortTrackLive:
    build:
      targets:
        ShortTrackLive: all
        ShortTrackLiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShortTrackLiveTests
